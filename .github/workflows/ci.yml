name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Python for executable export tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-training.txt
      - name: Install Python test dependencies
        run: python -m pip install -r backend/requirements-training.txt
      - name: Provide the project Python path used by source tests
        shell: bash
        run: mkdir -p .venv/Scripts && ln -s "$(command -v python)" .venv/Scripts/python.exe
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Typecheck
        run: npm exec --no -- tsc --noEmit
      - name: Run source tests
        run: npm test
      - name: Build frontend
        run: npm run build
      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-training.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-training.txt
      - name: Run backend tests
        run: python -m unittest discover -s backend -t . -p 'test_*.py' -v

  windows:
    name: Windows startup and browser checks
    runs-on: windows-latest
    needs: frontend
    # A healthy Edge regression run is about 21 minutes on a hosted Windows runner, which left
    # the previous 25-minute cap with little margin for a shared runner. The cap is 40 now so a
    # slow run reports a result instead of being killed before it can say what failed.
    timeout-minutes: 40
    env:
      CUDA_VISIBLE_DEVICES: '-1'
      PYTHONUNBUFFERED: '1'
      TENSORLAB_TEST_URL: http://127.0.0.1:8765
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-training.txt
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Create the project Python environment
        run: python -m venv .venv
      - name: Install Python test dependencies
        run: ./.venv/Scripts/python.exe -m pip install -r backend/requirements-training.txt
      - name: Download frontend build
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Check Windows startup entry points
        run: ./.venv/Scripts/python.exe -m unittest discover -s tests -p test_startup.py -v
      - name: Run core browser regressions in Microsoft Edge
        id: e2e
        # Run the regressions, then report what failed in the job summary instead of stopping at
        # "exit code 1". The summary is readable without downloading artifacts, which is what
        # makes a Windows-only failure diagnosable from outside the runner.
        continue-on-error: true
        shell: bash
        run: |
          npm run test:e2e -- e2e/editing.spec.ts e2e/history.spec.ts e2e/importExamples.spec.ts e2e/inference.spec.ts e2e/attentionInference.spec.ts e2e/trainedInference.spec.ts e2e/language.spec.ts e2e/errorBoundary.spec.ts e2e/runtime.spec.ts e2e/imageExport.spec.ts 2>&1 | tee e2e-output.txt
          exit "${PIPESTATUS[0]}"
      - name: Summarize browser failures
        if: steps.e2e.outcome == 'failure'
        shell: bash
        run: |
          {
            echo '## Edge regression failures'
            echo '### Failing tests'
            echo '```'
            grep -oE '^[[:space:]]+[0-9]+\) .*' e2e-output.txt | head -40 || true
            echo '```'
            echo '### Totals'
            echo '```'
            grep -E '^[[:space:]]+[0-9]+ (passed|failed|flaky)' e2e-output.txt | tail -5 || true
            echo '```'
            echo '### First error'
            echo '```'
            grep -B 2 -A 25 -m 1 'Error:' e2e-output.txt | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail the job when regressions failed
        if: steps.e2e.outcome == 'failure'
        run: exit 1
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-failures
          path: |
            test-results/
            artifacts/
          if-no-files-found: ignore
          retention-days: 7
